<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>러시아어 읽기 학습기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Noto+Serif:wght@400;700&family=Noto+Sans:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf6e3;
    --bg-alt:#eee8d5;
    --fg:#000000;
    --muted:#586e75;
    --border:#93a1a1;
    --accent:#268bd2;
    --accent2:#2aa198;
    --danger:#dc322f;
    --notif-bg:#fffdf5;
    --notif-border:#93a1a1;
    --ru-font:'PT Serif', serif;
    --ko-font:'Noto Sans KR', sans-serif;
    --ru-size:20px;
    --ko-size:16px;
  }
  body.dark{
    --bg:#002b36;
    --bg-alt:#073642;
    --fg:#eee8d5;
    --muted:#93a1a1;
    --border:#586e75;
    --accent:#2aa198;
    --accent2:#268bd2;
    --danger:#ff6e64;
    --notif-bg:#073642;
    --notif-border:#586e75;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:var(--ko-font);
    transition:background .2s,color .2s;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    background:var(--bg-alt);
    color:var(--fg);
    border:1px solid var(--border);
    border-radius:6px;
    padding:6px 10px;
    font-size:13px;
  }
  button:hover{border-color:var(--accent);}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  select,input[type=range],input[type=text],textarea{
    font-family:inherit;
    background:var(--bg-alt);
    color:var(--fg);
    border:1px solid var(--border);
    border-radius:6px;
    padding:5px;
  }
  h1,h2,h3{margin:.2em 0;}
  .layout{
    display:grid;
    grid-template-columns: 250px 1fr 300px;
    grid-template-areas: "left main right";
    min-height:100vh;
  }
  #controls{
    grid-area:left;
    border-right:1px solid var(--border);
    padding:14px 10px;
    display:flex;
    flex-direction:column;
    gap:14px;
    overflow-y:auto;
    max-height:100vh;
    position:sticky;
    top:0;
  }
  .ctrl-group{
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .ctrl-group h4{margin:0 0 4px 0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .ctrl-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .main-col{
    grid-area:main;
    display:flex;
    flex-direction:column;
    padding:20px 30px;
    max-width:900px;
    margin:0 auto;
    width:100%;
  }
  .page-wrap{flex:1;}
  .paragraph-block{display:flex;flex-direction:column;gap:14px;}
  .para-text{
    font-family:var(--ru-font);
    font-size:var(--ru-size);
    line-height:1.8;
  }
  .token{cursor:pointer;padding:0 1px;border-radius:3px;}
  .token:hover{background:var(--bg-alt);}
  .token.selected{background:var(--accent);color:#fff;}
  .para-translation{
    font-family:var(--ko-font);
    font-size:var(--ko-size);
    color:var(--muted);
    border-top:1px dashed var(--border);
    padding-top:10px;
    min-height:1.4em;
  }
  .notif-panel{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .notif-block{
    background:var(--notif-bg);
    border:1px solid var(--notif-border);
    border-radius:8px;
    padding:8px 10px;
    font-size:14px;
    position:relative;
  }
  .notif-block .src{
    font-family:var(--ru-font);
    font-weight:700;
    margin-bottom:4px;
  }
  .notif-block .pos-line{margin:2px 0;}
  .notif-block .pos-label{color:var(--accent2);font-weight:700;margin-right:4px;}
  .notif-block .close-x{
    position:absolute;top:4px;right:6px;
    cursor:pointer;color:var(--muted);
    font-size:12px;
  }
  #notifPanelMobile{display:none;}
  .side-right{
    grid-area:right;
    border-left:1px solid var(--border);
    padding:14px 10px;
    overflow-y:auto;
    max-height:100vh;
    position:sticky;
    top:0;
  }
  .page-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:16px 0;
    border-top:1px solid var(--border);
    margin-top:16px;
  }
  #pageIndicator{font-size:13px;color:var(--muted);}
  textarea#pasteArea{width:100%;min-height:150px;font-family:var(--ru-font);}
  .modal-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.5);
    align-items:center;justify-content:center;
    z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:16px;
    width:min(600px,90vw);
    max-height:80vh;
    overflow-y:auto;
    display:flex;flex-direction:column;gap:10px;
  }
  .small-note{font-size:11px;color:var(--muted);}
  .flex-between{display:flex;justify-content:space-between;align-items:center;}
  @media (max-width:900px){
    .layout{
      grid-template-columns:1fr;
      grid-template-areas:"main";
      padding-bottom:78px;
    }
    #controls{
      grid-area:unset;
      position:fixed;
      left:0;right:0;bottom:0;
      max-height:none;
      flex-direction:row;
      overflow-x:auto;
      overflow-y:hidden;
      background:var(--bg);
      border-right:none;
      border-top:1px solid var(--border);
      padding:8px;
      z-index:40;
      align-items:flex-start;
    }
    .ctrl-group{min-width:150px;flex:0 0 auto;}
    .side-right{display:none;}
    #notifPanelMobile{display:flex;flex-direction:column;gap:8px;}
    .main-col{padding:14px 14px 90px;}
  }
</style>
</head>
<body>
<div class="layout" id="layout">
  <aside id="controls">
    <div class="ctrl-group">
      <h4>글 불러오기</h4>
      <div class="ctrl-row">
        <button id="btnPaste">붙여넣기</button>
        <button id="btnLoadFile">파일 불러오기</button>
        <input type="file" id="fileInput" accept=".txt" style="display:none;">
      </div>
    </div>
    <div class="ctrl-group">
      <h4>이동</h4>
      <div class="ctrl-row">
        <select id="jumpSelect" style="max-width:180px;"></select>
      </div>
    </div>
    <div class="ctrl-group">
      <h4>폰트 / 크기</h4>
      <div class="ctrl-row">
        <span class="small-note" style="width:100%;">러시아어 본문</span>
        <select id="ruFontSelect">
          <option value="'PT Serif', serif">PT Serif</option>
          <option value="'Noto Serif', serif">Noto Serif</option>
          <option value="'Noto Sans', sans-serif">Noto Sans</option>
          <option value="Georgia, 'Times New Roman', serif">Georgia (시스템)</option>
        </select>
        <input type="range" id="ruSizeRange" min="14" max="34" value="20">
      </div>
      <div class="ctrl-row">
        <span class="small-note" style="width:100%;">한국어 번역</span>
        <select id="koFontSelect">
          <option value="'Noto Sans KR', sans-serif">Noto Sans KR</option>
          <option value="'Nanum Gothic', sans-serif">나눔고딕</option>
          <option value="'Noto Serif KR', serif">Noto Serif KR</option>
          <option value="'Malgun Gothic', sans-serif">맑은 고딕 (시스템)</option>
        </select>
        <input type="range" id="koSizeRange" min="12" max="28" value="16">
      </div>
    </div>
    <div class="ctrl-group">
      <h4>번역 대상 언어</h4>
      <div class="ctrl-row">
        <select id="targetLangSelect">
          <option value="ko">한국어</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
        </select>
      </div>
    </div>
    <div class="ctrl-group">
      <h4>화면</h4>
      <div class="ctrl-row">
        <button id="btnDark">다크 모드</button>
      </div>
    </div>
    <div class="ctrl-group">
      <h4>내보내기</h4>
      <div class="ctrl-row">
        <button id="btnExportTxt">TXT 다운로드</button>
        <button id="btnExportClipboard">클립보드 복사</button>
      </div>
    </div>
  </aside>

  <main class="main-col">
    <div class="page-wrap">
      <div class="paragraph-block">
        <div class="para-text" id="paraText">
          <p class="small-note">왼쪽(모바일: 하단)의 "붙여넣기" 또는 "파일 불러오기"로 러시아어 글을 입력하세요.</p>
        </div>
        <div class="notif-panel" id="notifPanelMobile"></div>
        <div class="para-translation" id="paraTranslation"></div>
      </div>
    </div>
    <div class="page-nav">
      <button id="prevPage">← 이전 문단</button>
      <span id="pageIndicator">0 / 0</span>
      <button id="nextPage">다음 문단 →</button>
    </div>
  </main>

  <aside class="side-right">
    <div class="flex-between">
      <h3 style="font-size:14px;">선택한 단어 / 구 번역</h3>
      <button id="btnClearSel" style="font-size:11px;">전체 해제</button>
    </div>
    <div class="notif-panel" id="notifPanelDesktop"></div>
  </aside>
</div>

<div class="modal-overlay" id="pasteModal">
  <div class="modal">
    <h3>러시아어 글 붙여넣기</h3>
    <textarea id="pasteArea" placeholder="여기에 러시아어 텍스트를 붙여넣으세요..."></textarea>
    <div class="ctrl-row" style="justify-content:flex-end;">
      <button id="btnPasteCancel">취소</button>
      <button id="btnPasteApply" class="primary">적용</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- State ----------
  const state = {
    pages: [],           // {rawText, segments:[{type:'word'|'other', text, charStart, charEnd, wordIndex}], wordCount, selected:Set, cache:Map(runKey->result), paraTranslation:null}
    current: 0,
    settings: {
      ruFont: "'PT Serif', serif",
      koFont: "'Noto Sans KR', sans-serif",
      ruSize: 20,
      koSize: 16,
      dark: false,
      targetLang: 'ko'
    }
  };

  const LS_KEY = 'ru-reader-settings-v1';

  function loadSettings(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(raw){
        Object.assign(state.settings, JSON.parse(raw));
      }
    }catch(e){ /* ignore */ }
  }
  function saveSettings(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state.settings)); }catch(e){}
  }

  function applySettingsToDOM(){
    const r = document.documentElement.style;
    r.setProperty('--ru-font', state.settings.ruFont);
    r.setProperty('--ko-font', state.settings.koFont);
    r.setProperty('--ru-size', state.settings.ruSize+'px');
    r.setProperty('--ko-size', state.settings.koSize+'px');
    document.body.classList.toggle('dark', state.settings.dark);
    ruFontSelect.value = state.settings.ruFont;
    koFontSelect.value = state.settings.koFont;
    ruSizeRange.value = state.settings.ruSize;
    koSizeRange.value = state.settings.koSize;
    targetLangSelect.value = state.settings.targetLang;
  }

  // ---------- DOM refs ----------
  const paraText = document.getElementById('paraText');
  const paraTranslation = document.getElementById('paraTranslation');
  const notifPanelDesktop = document.getElementById('notifPanelDesktop');
  const notifPanelMobile = document.getElementById('notifPanelMobile');
  const pageIndicator = document.getElementById('pageIndicator');
  const jumpSelect = document.getElementById('jumpSelect');
  const prevPageBtn = document.getElementById('prevPage');
  const nextPageBtn = document.getElementById('nextPage');
  const ruFontSelect = document.getElementById('ruFontSelect');
  const koFontSelect = document.getElementById('koFontSelect');
  const ruSizeRange = document.getElementById('ruSizeRange');
  const koSizeRange = document.getElementById('koSizeRange');
  const targetLangSelect = document.getElementById('targetLangSelect');
  const btnDark = document.getElementById('btnDark');
  const btnPaste = document.getElementById('btnPaste');
  const btnLoadFile = document.getElementById('btnLoadFile');
  const fileInput = document.getElementById('fileInput');
  const pasteModal = document.getElementById('pasteModal');
  const pasteArea = document.getElementById('pasteArea');
  const btnPasteCancel = document.getElementById('btnPasteCancel');
  const btnPasteApply = document.getElementById('btnPasteApply');
  const btnClearSel = document.getElementById('btnClearSel');
  const btnExportTxt = document.getElementById('btnExportTxt');
  const btnExportClipboard = document.getElementById('btnExportClipboard');

  // ---------- Tokenizer ----------
  const WORD_RE = /[A-Za-zА-Яа-яЁёІіЇїЄєҐґ]+(?:[-''][A-Za-zА-Яа-яЁёІіЇїЄєҐґ]+)*/g;

  function tokenizeParagraph(text){
    const segments = [];
    let lastIndex = 0;
    let wordIndex = 0;
    WORD_RE.lastIndex = 0;
    let m;
    while((m = WORD_RE.exec(text)) !== null){
      if(m.index > lastIndex){
        segments.push({type:'other', text:text.slice(lastIndex, m.index)});
      }
      segments.push({type:'word', text:m[0], charStart:m.index, charEnd:m.index+m[0].length, wordIndex:wordIndex});
      wordIndex++;
      lastIndex = m.index + m[0].length;
    }
    if(lastIndex < text.length){
      segments.push({type:'other', text:text.slice(lastIndex)});
    }
    return {segments, wordCount:wordIndex};
  }

  function splitParagraphs(raw){
    let parts = raw.split(/\n{2,}/).map(s=>s.trim()).filter(Boolean);
    if(parts.length <= 1){
      parts = raw.split(/\n/).map(s=>s.trim()).filter(Boolean);
    }
    return parts;
  }

  function loadText(raw){
    const paragraphs = splitParagraphs(raw);
    state.pages = paragraphs.map(p => {
      const {segments, wordCount} = tokenizeParagraph(p);
      return {
        rawText: p,
        segments,
        wordCount,
        selected: new Set(),
        cache: new Map(),
        paraTranslation: null
      };
    });
    state.current = 0;
    buildJumpSelect();
    renderPage();
  }

  function buildJumpSelect(){
    jumpSelect.innerHTML = '';
    state.pages.forEach((p, i)=>{
      const opt = document.createElement('option');
      opt.value = i;
      const preview = p.rawText.slice(0,20).replace(/\s+/g,' ');
      opt.textContent = (i+1)+'. '+preview+(p.rawText.length>20?'…':'');
      jumpSelect.appendChild(opt);
    });
  }

  // ---------- Translation API ----------
  const translateCacheGlobal = new Map(); // key: lang+':'+dict+':'+text -> promise/result

  async function callGoogleTranslate(text, dict, targetLang){
    const key = targetLang+':'+(dict?1:0)+':'+text;
    if(translateCacheGlobal.has(key)) return translateCacheGlobal.get(key);
    const params = new URLSearchParams();
    params.set('client','gtx');
    params.set('sl','ru');
    params.set('tl', targetLang);
    params.append('dt','t');
    if(dict) params.append('dt','bd');
    params.set('q', text);
    const url = 'https://translate.googleapis.com/translate_a/single?'+params.toString();
    const p = fetch(url).then(res=>{
      if(!res.ok) throw new Error('HTTP '+res.status);
      return res.json();
    });
    translateCacheGlobal.set(key, p);
    try{
      return await p;
    }catch(e){
      translateCacheGlobal.delete(key);
      throw e;
    }
  }

  function parsePlainTranslation(data){
    if(!data || !Array.isArray(data[0])) return '';
    return data[0].map(seg => seg && seg[0] ? seg[0] : '').join('');
  }

  function parseDict(data){
    if(!Array.isArray(data)) return null;
    for(const el of data){
      if(Array.isArray(el) && el.length){
        const valid = el.every(item => Array.isArray(item) && typeof item[0]==='string' && Array.isArray(item[1]));
        if(valid) return el.map(item => ({pos:item[0], terms:item[1]}));
      }
    }
    return null;
  }

  async function translatePlain(text){
    const data = await callGoogleTranslate(text, false, state.settings.targetLang);
    return parsePlainTranslation(data);
  }

  async function translateWithDict(text){
    const data = await callGoogleTranslate(text, true, state.settings.targetLang);
    const plain = parsePlainTranslation(data);
    const dict = parseDict(data);
    return {plain, dict};
  }

  // ---------- Rendering ----------
  function renderPage(){
    if(state.pages.length === 0){
      pageIndicator.textContent = '0 / 0';
      return;
    }
    const page = state.pages[state.current];
    pageIndicator.textContent = (state.current+1)+' / '+state.pages.length;
    jumpSelect.value = state.current;

    // render paragraph text
    paraText.innerHTML = '';
    page.segments.forEach(seg=>{
      if(seg.type === 'word'){
        const span = document.createElement('span');
        span.className = 'token' + (page.selected.has(seg.wordIndex) ? ' selected' : '');
        span.textContent = seg.text;
        span.dataset.wordIndex = seg.wordIndex;
        span.addEventListener('click', onTokenClick);
        paraText.appendChild(span);
      } else {
        paraText.appendChild(document.createTextNode(seg.text));
      }
    });

    renderNotifications();
    renderParaTranslation();
  }

  function onTokenClick(e){
    const page = state.pages[state.current];
    const idx = parseInt(e.currentTarget.dataset.wordIndex, 10);
    if(page.selected.has(idx)) page.selected.delete(idx);
    else page.selected.add(idx);
    e.currentTarget.classList.toggle('selected');
    renderNotifications();
  }

  function computeRuns(selectedArr){
    const sorted = [...selectedArr].sort((a,b)=>a-b);
    const runs = [];
    let run = [];
    for(let i=0;i<sorted.length;i++){
      if(run.length===0 || sorted[i] === run[run.length-1]+1){
        run.push(sorted[i]);
      } else {
        runs.push(run);
        run = [sorted[i]];
      }
    }
    if(run.length) runs.push(run);
    return runs;
  }

  function getWordSegByIndex(page, wordIndex){
    return page.segments.find(s=>s.type==='word' && s.wordIndex===wordIndex);
  }

  function runText(page, run){
    const startSeg = getWordSegByIndex(page, run[0]);
    const endSeg = getWordSegByIndex(page, run[run.length-1]);
    return page.rawText.slice(startSeg.charStart, endSeg.charEnd);
  }

  async function renderNotifications(){
    const page = state.pages[state.current];
    const selectedArr = [...page.selected];
    notifPanelDesktop.innerHTML = '';
    notifPanelMobile.innerHTML = '';

    if(selectedArr.length === 0) return;

    if(selectedArr.length === 1){
      const idx = selectedArr[0];
      const seg = getWordSegByIndex(page, idx);
      const cacheKey = 'single:'+idx+':'+state.settings.targetLang;
      const block = createNotifBlock(seg.text, '불러오는 중...', idx);
      appendNotif(block);
      let result = page.cache.get(cacheKey);
      if(!result){
        try{
          result = await translateWithDict(seg.text);
          page.cache.set(cacheKey, result);
        }catch(err){
          updateNotifError(block, err);
          return;
        }
      }
      if(!page.selected.has(idx)) return; // deselected while loading
      updateNotifSingle(block, result);
      return;
    }

    const runs = computeRuns(selectedArr);
    for(const run of runs){
      const text = runText(page, run);
      const runKey = 'run:'+run[0]+'-'+run[run.length-1]+':'+state.settings.targetLang;
      const block = createNotifBlock(text, '불러오는 중...', run);
      appendNotif(block);
      (async ()=>{
        let translated = page.cache.get(runKey);
        if(!translated){
          try{
            translated = await translatePlain(text);
            page.cache.set(runKey, translated);
          }catch(err){
            updateNotifError(block, err);
            return;
          }
        }
        const stillValid = run.every(i=>page.selected.has(i));
        if(!stillValid) return;
        updateNotifPlain(block, translated);
      })();
    }
  }

  function appendNotif(block){
    notifPanelDesktop.appendChild(block);
    notifPanelMobile.appendChild(block.cloneNode(true));
    // re-bind close on the clone
    const clones = notifPanelMobile.querySelectorAll('.notif-block:last-child .close-x');
    clones.forEach(x=>{
      x.addEventListener('click', block._closeHandler);
    });
  }

  function createNotifBlock(srcText, bodyText, refKey){
    const div = document.createElement('div');
    div.className = 'notif-block';
    const src = document.createElement('div');
    src.className = 'src';
    src.textContent = srcText;
    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = bodyText;
    const close = document.createElement('span');
    close.className = 'close-x';
    close.textContent = '✕';
    const handler = ()=>{
      const page = state.pages[state.current];
      if(Array.isArray(refKey)){
        refKey.forEach(i=>page.selected.delete(i));
      } else {
        page.selected.delete(refKey);
      }
      renderPage();
    };
    close.addEventListener('click', handler);
    div._closeHandler = handler;
    div._bodyEl = body;
    div.appendChild(close);
    div.appendChild(src);
    div.appendChild(body);
    return div;
  }

  function syncBothPanels(sourceBlock, updateFn){
    updateFn(sourceBlock._bodyEl, sourceBlock);
    // find matching clone in the other panel by src text + index among siblings
    const parent = sourceBlock.parentElement;
    const other = (parent === notifPanelDesktop) ? notifPanelMobile : notifPanelDesktop;
    const idx = Array.from(parent.children).indexOf(sourceBlock);
    const otherBlock = other.children[idx];
    if(otherBlock){
      const bodyEl = otherBlock.querySelector('.body');
      if(bodyEl) updateFn(bodyEl, otherBlock);
    }
  }

  function updateNotifSingle(block, result){
    syncBothPanels(block, (bodyEl)=>{
      bodyEl.innerHTML = '';
      if(result.dict && result.dict.length){
        result.dict.forEach(entry=>{
          const line = document.createElement('div');
          line.className = 'pos-line';
          const label = document.createElement('span');
          label.className = 'pos-label';
          label.textContent = '['+entry.pos+']';
          line.appendChild(label);
          line.appendChild(document.createTextNode(entry.terms.join(', ')));
          bodyEl.appendChild(line);
        });
      } else {
        bodyEl.textContent = result.plain || '(번역 없음)';
      }
    });
  }

  function updateNotifPlain(block, text){
    syncBothPanels(block, (bodyEl)=>{
      bodyEl.textContent = text || '(번역 없음)';
    });
  }

  function updateNotifError(block, err){
    syncBothPanels(block, (bodyEl)=>{
      bodyEl.textContent = '번역 요청 실패 (네트워크/CORS 문제일 수 있음)';
      bodyEl.style.color = 'var(--danger)';
    });
  }

  async function renderParaTranslation(){
    const page = state.pages[state.current];
    if(page.paraTranslation){
      paraTranslation.textContent = page.paraTranslation;
      return;
    }
    paraTranslation.textContent = '문단 번역 불러오는 중...';
    try{
      const t = await translatePlain(page.rawText);
      page.paraTranslation = t;
      if(state.pages[state.current] === page){
        paraTranslation.textContent = t;
      }
    }catch(err){
      paraTranslation.textContent = '번역 요청 실패 (네트워크/CORS 문제일 수 있음)';
    }
  }

  // ---------- Navigation ----------
  prevPageBtn.addEventListener('click', ()=>{
    if(state.current > 0){ state.current--; renderPage(); }
  });
  nextPageBtn.addEventListener('click', ()=>{
    if(state.current < state.pages.length-1){ state.current++; renderPage(); }
  });
  jumpSelect.addEventListener('change', ()=>{
    state.current = parseInt(jumpSelect.value, 10);
    renderPage();
  });

  // ---------- Controls: paste / load ----------
  btnPaste.addEventListener('click', ()=>{
    pasteArea.value = '';
    pasteModal.classList.add('open');
  });
  btnPasteCancel.addEventListener('click', ()=>{
    pasteModal.classList.remove('open');
  });
  btnPasteApply.addEventListener('click', ()=>{
    const text = pasteArea.value.trim();
    if(text){ loadText(text); }
    pasteModal.classList.remove('open');
  });
  btnLoadFile.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=> loadText(reader.result);
    reader.readAsText(file, 'utf-8');
    fileInput.value = '';
  });

  // ---------- Controls: font / size / lang / dark ----------
  ruFontSelect.addEventListener('change', ()=>{
    state.settings.ruFont = ruFontSelect.value;
    applySettingsToDOM(); saveSettings();
  });
  koFontSelect.addEventListener('change', ()=>{
    state.settings.koFont = koFontSelect.value;
    applySettingsToDOM(); saveSettings();
  });
  ruSizeRange.addEventListener('input', ()=>{
    state.settings.ruSize = parseInt(ruSizeRange.value,10);
    applySettingsToDOM(); saveSettings();
  });
  koSizeRange.addEventListener('input', ()=>{
    state.settings.koSize = parseInt(koSizeRange.value,10);
    applySettingsToDOM(); saveSettings();
  });
  targetLangSelect.addEventListener('change', ()=>{
    state.settings.targetLang = targetLangSelect.value;
    // invalidate cached translations since language changed
    state.pages.forEach(p=>{ p.cache.clear(); p.paraTranslation = null; });
    applySettingsToDOM(); saveSettings();
    renderPage();
  });
  btnDark.addEventListener('click', ()=>{
    state.settings.dark = !state.settings.dark;
    applySettingsToDOM(); saveSettings();
  });
  btnClearSel.addEventListener('click', ()=>{
    if(state.pages.length===0) return;
    state.pages[state.current].selected.clear();
    renderPage();
  });

  // ---------- Export ----------
  async function buildExportText(){
    let out = '';
    for(let i=0;i<state.pages.length;i++){
      const page = state.pages[i];
      out += '===== 문단 '+(i+1)+' =====\n';
      out += '[원문]\n'+page.rawText+'\n\n';

      out += '[선택 단어/구 번역]\n';
      if(page.selected.size === 0){
        out += '(선택 없음)\n';
      } else {
        const selectedArr = [...page.selected];
        if(selectedArr.length === 1){
          const idx = selectedArr[0];
          const seg = getWordSegByIndex(page, idx);
          const cacheKey = 'single:'+idx+':'+state.settings.targetLang;
          let result = page.cache.get(cacheKey);
          if(!result){
            try{ result = await translateWithDict(seg.text); page.cache.set(cacheKey, result); }
            catch(e){ result = {plain:'(번역 실패)', dict:null}; }
          }
          out += seg.text+' => ';
          if(result.dict && result.dict.length){
            out += result.dict.map(d=>'['+d.pos+'] '+d.terms.join(', ')).join(' / ');
          } else {
            out += result.plain;
          }
          out += '\n';
        } else {
          const runs = computeRuns(selectedArr);
          for(const run of runs){
            const text = runText(page, run);
            const runKey = 'run:'+run[0]+'-'+run[run.length-1]+':'+state.settings.targetLang;
            let translated = page.cache.get(runKey);
            if(!translated){
              try{ translated = await translatePlain(text); page.cache.set(runKey, translated); }
              catch(e){ translated = '(번역 실패)'; }
            }
            out += text+' => '+translated+'\n';
          }
        }
      }
      out += '\n[문단 번역]\n';
      if(!page.paraTranslation){
        try{ page.paraTranslation = await translatePlain(page.rawText); }
        catch(e){ page.paraTranslation = '(번역 실패)'; }
      }
      out += page.paraTranslation+'\n\n';
    }
    return out;
  }

  btnExportTxt.addEventListener('click', async ()=>{
    if(state.pages.length===0) return;
    btnExportTxt.disabled = true;
    btnExportTxt.textContent = '내보내는 중...';
    try{
      const text = await buildExportText();
      const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'russian-reading-export.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } finally {
      btnExportTxt.disabled = false;
      btnExportTxt.textContent = 'TXT 다운로드';
    }
  });

  btnExportClipboard.addEventListener('click', async ()=>{
    if(state.pages.length===0) return;
    btnExportClipboard.disabled = true;
    btnExportClipboard.textContent = '복사 준비 중...';
    try{
      const text = await buildExportText();
      await navigator.clipboard.writeText(text);
      btnExportClipboard.textContent = '복사됨!';
      setTimeout(()=>{ btnExportClipboard.textContent = '클립보드 복사'; btnExportClipboard.disabled=false; }, 1500);
    } catch(e){
      btnExportClipboard.textContent = '복사 실패';
      setTimeout(()=>{ btnExportClipboard.textContent = '클립보드 복사'; btnExportClipboard.disabled=false; }, 1500);
    }
  });

  // ---------- Init ----------
  loadSettings();
  applySettingsToDOM();
})();
</script>
</body>
</html>
